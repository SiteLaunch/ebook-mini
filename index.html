<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koleksi Ebook Mini</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap">

  <div class="hero">
    <h1>Kau bukan malas.<br>Kau cuma asyik tangguh.</h1>
    <p>Koleksi mini ebook. Semua boleh baca.</p>
  </div>

  <div id="ebookList"></div>

  <div class="note">
    Semua ebook percuma di depan.<br>
    Versi sambungan ada di dalam bacaan.
  </div>

</div>

<script>
fetch('ebooks.json')
  .then(r => r.json())
  .then(data => {
    const list = document.getElementById('ebookList');

    data.forEach((e, i) => {
      const card = document.createElement('div');
      card.className = 'card';

      card.innerHTML = `
        <span class="badge">EBOOK ${String(i+1).padStart(2,'0')} • FREE</span>
        <h2>${e.title}</h2>
        ${e.subtitle ? `<p>${e.subtitle}</p>` : ``}
        <p>${e.desc}</p>
        <a href="ebooks/${e.id}/index.html" class="btn">
          Baca Ebook
        </a>
      `;
      list.appendChild(card);
    });
  });
</script>

</body>
</html>
