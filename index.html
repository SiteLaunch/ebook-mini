<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ebook Mini</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{
--bg:#1E2328;--card:#262B31;--border:#343A40;
--text:#F1F5F9;--muted:#A8B0BC;--accent:#8FB3C8;--gold:#E6C98A;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter;background:linear-gradient(180deg,#1B2025,#1E2328);color:var(--text);}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px;}
.hero{max-width:480px;width:100%;background:var(--card);border:1.5px solid var(--border);
border-radius:24px;padding:28px 24px 36px;box-shadow:0 30px 60px rgba(0,0,0,.55);}
.cover{width:72%;margin:0 auto 24px;display:block;border-radius:14px;
box-shadow:0 18px 40px rgba(0,0,0,.6);}
h1{font-size:1.9rem;font-weight:900;line-height:1.25;margin-bottom:14px;}
p{color:var(--muted);line-height:1.6;margin-bottom:24px;}
.btn{display:block;text-align:center;padding:18px;border-radius:16px;
background:linear-gradient(135deg,var(--accent),#7AA3BC);
color:#0F172A;font-weight:800;text-decoration:none;}
.meta{text-align:center;font-size:.9rem;color:var(--muted);margin-top:14px;}
.note{text-align:center;color:var(--gold);margin-top:22px;font-size:.95rem;}
</style>
</head>
<body>
<div class="wrap">
<div class="hero">
