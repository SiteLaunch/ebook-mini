<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ebook Full</title>
<link rel="stylesheet" href="../../style.css">
</head>
<body>

<script>
if(localStorage.getItem("ebook_access")!=="yes"){
  window.location.href="../../login.html";
}
</script>

<div class="wrap">

  <div class="hero">
    <h1>Kau Bukan Malas (Full)</h1>
    <p>Akses disahkan</p>
  </div>

  <div class="card">
    <p>Ini versi penuh ebook.</p>
    <button onclick="logout()" class="btn">Logout</button>
  </div>

</div>

<script>
function logout(){
  localStorage.removeItem("ebook_access");
  window.location.href="../../login.html";
}
</script>

</body>
</html>
