<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap">
  <div class="hero">
    <h1>Login Ebook</h1>
    <p>Masukkan kod akses</p>
  </div>

  <div class="card">
    <input id="code" placeholder="Kod akses"
      style="width:100%;padding:14px;border-radius:12px;border:none;">
    <button onclick="login()" class="btn">Buka Ebook</button>
  </div>
</div>

<script>
function login(){
  if(document.getElementById("code").value==="MULA2025"){
    localStorage.setItem("ebook_access","yes");
    window.location.href="index.html";
  }else{
    alert("Kod salah");
  }
}
</script>

</body>
</html>
