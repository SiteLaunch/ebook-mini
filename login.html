<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login Ebook</title>
<style>
body{background:#1E2328;color:#F1F5F9;font-family:Inter;
display:flex;justify-content:center;align-items:center;min-height:100vh;}
.box{background:#262B31;padding:30px;border-radius:20px;max-width:360px;width:100%;}
input,button{width:100%;padding:14px;border-radius:12px;border:none;margin-top:12px;}
button{background:#8FB3C8;font-weight:800;color:#0F172A;}
.msg{margin-top:12px;font-size:.9rem;color:#F87171;}
a{color:#8FB3C8;font-size:.9rem;}
</style>
</head>
<body>
<div class="box">
<h3>Masuk Ebook</h3>
<input type="password" id="code" placeholder="Kod akses">
<button onclick="login()">Buka Ebook</button>
<div id="msg" class="msg"></div>
<p><a href="hilang-akses.html">Hilang akses?</a></p>
</div>
<script>
function login(){
const code=document.getElementById("code").value.trim().toUpperCase();
if(code==="MULA2025"){
localStorage.setItem("ebook_access","yes");
window.location.href="ebook-rm3.html";
}else{
document.getElementById("msg").innerText="Kod tidak sah";
}}
</script>
</body>
</html>
